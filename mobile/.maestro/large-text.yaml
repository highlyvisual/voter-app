# Largest accessibility text size: screenshots of each main screen, opened by deep link. Set the size first:
#   xcrun simctl ui <device> content_size accessibility-extra-extra-extra-large
appId: org.whatsittome.app
env:
  BALLOT: local.flintshire.higher-kinnerton.by.2026-10-15
  CANDIDATE: "299"
---
- launchApp
- takeScreenshot: L1-home
- openLink: whatsittome://elections/${BALLOT}
- tapOn:
    text: "Open"
    optional: true
- scrollUntilVisible:
    element: "Key dates"
    visibilityPercentage: 30
    timeout: 30000
- takeScreenshot: L2-ballot
- scrollUntilVisible:
    element: "The \\d+ candidates"
    visibilityPercentage: 30
- takeScreenshot: L3-ballot-candidates
- openLink: whatsittome://elections/${BALLOT}/candidate/${CANDIDATE}
- tapOn:
    text: "Open"
    optional: true
- scrollUntilVisible:
    element: "In their own words"
    visibilityPercentage: 30
    timeout: 30000
- takeScreenshot: L4a-candidate
- openLink: whatsittome://elections/${BALLOT}/topic/housing_and_property
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Housing and property"
    timeout: 20000
- takeScreenshot: L4-topic
- tapOn: "Profile"
- takeScreenshot: L5-profile
