name: Daily ballot ingest
# Pulls every current UK ballot from Democracy Club and upserts it. Needs two repository secrets:
#   SUPABASE_SERVICE_ROLE_KEY  (from Supabase → Project settings → API)
#   SUPABASE_URL               (https://urufvcutpksjppbjxouc.supabase.co)
on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily
  workflow_dispatch:
permissions:
  contents: write   # lets the last step commit the daily check reports back to the repo
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5      # v4 ran on Node 20, which GitHub is retiring
      - uses: actions/setup-python@v6  # same reason
        with: { python-version: "3.12" }
      - name: Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEMOCRACY_CLUB_TOKEN: ${{ secrets.DEMOCRACY_CLUB_TOKEN }}   # optional: lifts the 10-requests-a-minute limit
          PYTHONUNBUFFERED: "1"                                      # show progress in the log as it happens
        run: |
          python scripts/ingest_ballots.py
          python scripts/load_ingest.py
          python scripts/scan_leaflets.py
          python scripts/fetch_photos.py && python scripts/load_photos.py
      - name: Commit refreshed check reports
        run: |
          git config user.name "ingest-bot"; git config user.email "ingest-bot@users.noreply.github.com"
          git add reports || true; git commit -m "Daily ingest $(date -u +%F)" || echo "nothing to commit"; git push || true
